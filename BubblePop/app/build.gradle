plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.bubblepop'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bubblepop"
        minSdk 33          // Android 13 и выше
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ИСПРАВЛЕНИЕ КРАША: appcompat 1.7.0 требует kotlin-stdlib 1.9.x,
    // а предыдущая сборка принудительно понижала его до 1.8.22 и вырезал
    // модули jdk7/jdk8 — из-за этого на устройстве возникали
    // NoClassDefFoundError (игра "вылетала" сразу после запуска).
    // Теперь stdlib берётся той версии, которую ожидает appcompat.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
}
