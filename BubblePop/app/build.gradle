plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.bubblepop'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bubblepop"
        minSdk 33          // Android 13 и выше
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // kotlin-stdlib-jdk7/jdk8 начиная с 1.8.0 объединены в kotlin-stdlib —
    // исключаем старые артефакты, чтобы не было дубликатов классов
    configurations.configureEach {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
